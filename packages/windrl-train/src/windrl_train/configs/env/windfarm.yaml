# windrl-engine wind farm. `env_name` selects our wrapper in windrl_train.train;
# `kwargs` are the windrl_engine.env.config.WindFarmEnvConfig fields (control_mode
# is fixed to continuous by the wrapper). Override the farm case and horizon with
# e.g. `env.kwargs.layout=horns_rev2 env.kwargs.horizon=200`.
defaults:
  - _self_

env_name: WindFarm

scenario:
  name: ${env.kwargs.layout}
  task_name: ${env.kwargs.layout}

eval_metric: episode_return
implicit_agent_id: True
log_win_rate: False

# Optional constant free-stream wind (Scenario I). Null -> engine samples per reset
# (Scenario II). Override with e.g. `+env.fixed_wind.speed=8 +env.fixed_wind.direction=270`.
fixed_wind: null

kwargs:
  layout: turb3_row1
  horizon: 100
  yaw_step: 5.0
  load_coef: 0.1
