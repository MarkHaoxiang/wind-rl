# ---GCN Networks--- permutation-equivariant graph torso over the turbine axis.
# Select with `network=gcn`; `network=mlp` (Mava's default) stays the default.
# `num_features` must match the per-agent feature width (windrl_train.env
# `_AGENT_FEATURES`) so the critic can un-flatten the global state.
actor_network:
  pre_torso:
    _target_: windrl_train.networks.GCNTorso
    embed_dim: 128
    num_rounds: 2
    sigma: 0.5
    activation: relu

critic_network:
  pre_torso:
    _target_: windrl_train.networks.GCNGlobalCritic
    embed_dim: 128
    num_rounds: 2
    sigma: 0.5
    num_features: 7
    activation: relu
