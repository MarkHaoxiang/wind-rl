[project]
name = "windrl-train"
version = "0.1.0"
description = "Mava MAPPO training on the windrl-engine JAX wind farm (version-isolated: jax 0.5.3 / py3.12)"
authors = [
    { name = "MarkHaoxiang", email = "mark.haoxiang@gmail.com" }
]
# Isolated from the root workspace (py3.13 / jax 0.11): Mava pins jax==0.5.3 and
# python >=3.10,<3.13. See README for why this package has its own venv.
requires-python = ">=3.12,<3.13"
dependencies = [
    "windrl-engine",
    # wandb backend for the logger. Pinned <0.18: Mava's `tensorboard_logger`
    # ships pre-generated protobuf stubs that break on protobuf>=4, and newer
    # wandb pulls protobuf 7. This range resolves to protobuf 3.20.3, which
    # tensorboard_logger accepts. (Installed explicitly — this package is set up
    # `--no-deps`; see README.)
    "wandb>=0.16,<0.18",
    # Mava is deliberately NOT declared here: its distribution name is id-mava
    # (a PEP 508 "mava @ git+..." spec hard-fails), and a non-editable git wheel
    # drops mava/configs (no __init__.py), breaking Hydra's pkg://mava.configs.
    # Install it editable from a clone at the pinned SHA — see README / the CI
    # train-smoke job. Pinned SHA: e1cc61dd0d3a5e02cab126cfb46ddcb7c32a5fdf
]

[project.optional-dependencies]
# GPU (NVIDIA CUDA 12) support. Opt-in only — never a hard dependency, so CI
# (CPU-only, installs this package `--no-deps`) never pulls the multi-GB CUDA
# wheels. The jax version MUST match Mava's pin (jax==0.5.3); this extra just
# adds the `cuda12` plugin (jax-cuda12-plugin / -pjrt + nvidia-* wheels) on top
# of the CPU jaxlib Mava already installs. Install order matters — see the
# README "GPU" section: Mava first (it re-pins jax), then this extra LAST, or the
# plugin gets clobbered. The bundled wheels are CUDA 12.9, which covers Blackwell
# (sm_120, e.g. RTX 5090) via a recent driver's forward-compatible PTX JIT.
gpu = ["jax[cuda12]==0.5.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windrl_train"]

[tool.hatch.metadata]
allow-direct-references = true

# Type-checking runs inside this package's own venv (Mava + jumanji live only
# there, not in the root py3.13 venv). Non-strict: Mava/jumanji ship little typing.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
[[tool.mypy.overrides]]
module = ["mava.*", "jumanji.*", "windrl_engine.*"]
ignore_missing_imports = true
