[project]
name = "windrl-train"
version = "0.1.0"
description = "Experiment harness for windrl-engine (config/settings/verdict/wandb logging); the RL trainer is rewritten in-repo here."
authors = [
    { name = "MarkHaoxiang", email = "mark.haoxiang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "windrl-engine",
    "omegaconf>=2.3.1",
    "pydantic>=2",
    "pydantic-settings>=2",
    "wandb>=0.20",
    "equinox>=0.13",
    "distrax>=0.1.5",
    "optax>=0.2.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windrl_train"]

[tool.hatch.metadata]
allow-direct-references = true
