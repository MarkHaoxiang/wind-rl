<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wind farm episode replay</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --panel-2: #1c232d;
    --line: #2a323d;
    --fg: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --accent-2: #f0c674;
    --good: #3fb950;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    grid-template-columns: 1fr 340px;
    grid-template-rows: 1fr auto;
    height: 100vh;
  }
  #stage {
    grid-row: 1; grid-column: 1;
    position: relative;
    background: #05070a;
    overflow: hidden;
  }
  #field { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #hud {
    position: absolute; top: 12px; left: 12px;
    background: rgba(13,17,23,0.72);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    pointer-events: none;
    min-width: 168px;
  }
  #hud .big { font-size: 20px; font-weight: 600; }
  #hud .row { display: flex; justify-content: space-between; gap: 14px; margin-top: 3px; }
  #hud .k { color: var(--muted); }
  #windwrap {
    position: absolute; top: 12px; right: 12px;
    width: 92px; height: 92px;
    background: rgba(13,17,23,0.72);
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  aside {
    grid-row: 1 / span 2; grid-column: 2;
    background: var(--panel);
    border-left: 1px solid var(--line);
    padding: 14px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 16px;
  }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .card h2 { margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 600; }
  .card canvas { display: block; width: 100%; }
  .readouts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
  .readouts .v { font-size: 16px; font-weight: 600; }
  .readouts .l { color: var(--muted); font-size: 11px; }
  footer {
    grid-row: 2; grid-column: 1;
    background: var(--panel);
    border-top: 1px solid var(--line);
    padding: 10px 14px;
    display: flex; align-items: center; gap: 14px;
  }
  button {
    background: var(--panel-2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; font-size: 13px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  #play { min-width: 74px; font-weight: 600; }
  #scrub { flex: 1; accent-color: var(--accent); }
  select { background: var(--panel-2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 5px; }
  .frameno { color: var(--muted); font-variant-numeric: tabular-nums; min-width: 118px; text-align: right; }
  .hint { color: var(--muted); font-size: 11px; }
</style>
</head>
<body>
  <div id="stage">
    <canvas id="field"></canvas>
    <div id="hud">
      <div class="big" id="hud-power">— MW</div>
      <div class="row"><span class="k">wind</span><span id="hud-wind">—</span></div>
      <div class="row"><span class="k">reward</span><span id="hud-reward">—</span></div>
      <div class="row"><span class="k">energy</span><span id="hud-energy">—</span></div>
      <div class="row"><span class="k">step</span><span id="hud-step">—</span></div>
    </div>
    <canvas id="windwrap" width="92" height="92"></canvas>
  </div>

  <aside>
    <div class="card">
      <h2>Readouts</h2>
      <div class="readouts">
        <div><div class="l">farm power</div><div class="v" id="ro-power">—</div></div>
        <div><div class="l">wind</div><div class="v" id="ro-wind">—</div></div>
        <div><div class="l">reward</div><div class="v" id="ro-reward">—</div></div>
        <div><div class="l">cumulative energy</div><div class="v" id="ro-energy">—</div></div>
      </div>
    </div>
    <div class="card">
      <h2>Per-turbine power</h2>
      <canvas id="bars" height="150"></canvas>
    </div>
    <div class="card">
      <h2>Farm power timeline</h2>
      <canvas id="power-tl" height="90"></canvas>
    </div>
    <div class="card">
      <h2>Reward</h2>
      <canvas id="reward-tl" height="90"></canvas>
    </div>
    <div class="hint">space play/pause · ← → step · ↑ ↓ speed · click a timeline to seek</div>
  </aside>

  <footer>
    <button id="play">Play</button>
    <input id="scrub" type="range" min="0" max="0" value="0" />
    <label class="hint">speed
      <select id="speed">
        <option value="0.25">0.25×</option>
        <option value="0.5">0.5×</option>
        <option value="1" selected>1×</option>
        <option value="2">2×</option>
        <option value="4">4×</option>
        <option value="8">8×</option>
      </select>
    </label>
    <span class="frameno" id="frameno">0 / 0</span>
  </footer>

<script>
"use strict";

const VIRIDIS = [
  [68,1,84],[71,44,122],[59,81,139],[44,113,142],[33,144,141],
  [39,173,129],[92,200,99],[170,220,50],[253,231,37]
];
function viridis(t) {
  t = Math.max(0, Math.min(1, t));
  const s = t * (VIRIDIS.length - 1);
  const i = Math.floor(s), f = s - i;
  const a = VIRIDIS[i], b = VIRIDIS[Math.min(i + 1, VIRIDIS.length - 1)];
  return [a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f];
}
// warm scale for power (dark -> amber -> white)
function powerColor(t) {
  t = Math.max(0, Math.min(1, t));
  const stops = [[40,44,52],[140,74,20],[230,150,30],[247,214,120],[255,248,230]];
  const s = t * (stops.length - 1), i = Math.floor(s), f = s - i;
  const a = stops[i], b = stops[Math.min(i+1, stops.length-1)];
  return `rgb(${Math.round(a[0]+(b[0]-a[0])*f)},${Math.round(a[1]+(b[1]-a[1])*f)},${Math.round(a[2]+(b[2]-a[2])*f)})`;
}

const state = {
  meta: null,
  frame: 0,
  playing: false,
  speed: 1,
  fieldCache: new Map(),
  farmPower: [],
  cumEnergy: [],
  drawRect: { x: 0, y: 0, w: 0, h: 0 },
  offscreen: null,
};

const $ = (id) => document.getElementById(id);

async function boot() {
  const meta = await (await fetch("/api/meta")).json();
  state.meta = meta;
  const F = meta.frames;
  state.farmPower = F.power.map((row) => row.reduce((s, v) => s + v, 0));
  let e = 0;
  state.cumEnergy = state.farmPower.map((p) => {
    e += p * meta.seconds_per_step;
    return e; // joules
  });
  const off = document.createElement("canvas");
  off.width = meta.field_shape[1];
  off.height = meta.field_shape[0];
  state.offscreen = off;

  $("scrub").max = String(meta.n_frames - 1);
  sizeStage();
  window.addEventListener("resize", () => { sizeStage(); render(); });
  wireControls();
  await ensureField(0);
  render();
  prefetchAround(0);
}

function sizeStage() {
  const stage = $("stage");
  const cv = $("field");
  const dpr = window.devicePixelRatio || 1;
  const w = stage.clientWidth, h = stage.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const [xmin, xmax, ymin, ymax] = state.meta.extent;
  const worldAR = (xmax - xmin) / (ymax - ymin);
  const viewAR = w / h;
  let dw, dh;
  if (viewAR > worldAR) { dh = h; dw = h * worldAR; }
  else { dw = w; dh = w / worldAR; }
  state.drawRect = { x: (w - dw) / 2, y: (h - dh) / 2, w: dw, h: dh };
}

const FIELD_CACHE_LIMIT = 64; // ~230 KB/frame; caps the in-tab budget at ~15 MB

async function ensureField(frame) {
  if (state.fieldCache.has(frame)) {
    const arr = state.fieldCache.get(frame);
    // Map preserves insertion order: delete + re-set moves this entry to the
    // most-recently-used end.
    state.fieldCache.delete(frame);
    state.fieldCache.set(frame, arr);
    return arr;
  }
  const buf = await (await fetch(`/api/field?frame=${frame}`)).arrayBuffer();
  const arr = new Float32Array(buf);
  state.fieldCache.set(frame, arr);
  if (state.fieldCache.size > FIELD_CACHE_LIMIT) {
    state.fieldCache.delete(state.fieldCache.keys().next().value);
  }
  return arr;
}

function prefetchAround(frame) {
  for (let d = 1; d <= 4; d++) {
    const n = frame + d;
    if (n < state.meta.n_frames && !state.fieldCache.has(n)) ensureField(n);
  }
}

function worldToScreen(wx, wy) {
  const [xmin, xmax, ymin, ymax] = state.meta.extent;
  const r = state.drawRect;
  return [
    r.x + ((wx - xmin) / (xmax - xmin)) * r.w,
    r.y + (1 - (wy - ymin) / (ymax - ymin)) * r.h,
  ];
}

function drawFieldImage(arr) {
  const [ny, nx] = state.meta.field_shape;
  const vmin = state.meta.field_vmin, vmax = state.meta.field_vmax;
  const off = state.offscreen, octx = off.getContext("2d");
  const img = octx.createImageData(nx, ny);
  for (let r = 0; r < ny; r++) {
    const srow = (ny - 1 - r) * nx; // origin lower -> screen top is ymax
    const drow = r * nx;
    for (let c = 0; c < nx; c++) {
      const u = arr[srow + c];
      const col = viridis((u - vmin) / (vmax - vmin));
      const p = (drow + c) * 4;
      img.data[p] = col[0]; img.data[p+1] = col[1]; img.data[p+2] = col[2]; img.data[p+3] = 255;
    }
  }
  octx.putImageData(img, 0, 0);
}

function render() {
  const meta = state.meta;
  if (!meta) return;
  const f = state.frame, F = meta.frames;
  const cv = $("field"), ctx = cv.getContext("2d");
  const r = state.drawRect;
  ctx.clearRect(0, 0, cv.width, cv.height);

  const arr = state.fieldCache.get(f);
  if (arr) {
    drawFieldImage(arr);
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(state.offscreen, r.x, r.y, r.w, r.h);
  }

  drawTurbines(ctx, f);
  drawWind(F.wind_direction[f], F.wind_speed[f]);
  updateReadouts(f);
  drawBars(f);
  drawTimeline($("power-tl"), state.farmPower.map((p) => p / 1e6), f, "MW", "#58a6ff");
  drawTimeline($("reward-tl"), F.reward, f, "", "#3fb950");
  $("scrub").value = String(f);
  $("frameno").textContent = `${f} / ${meta.n_frames - 1}`;
}

function drawTurbines(ctx, f) {
  const meta = state.meta, F = meta.frames;
  const pmax = meta.power_max;
  const scale = state.drawRect.w / (meta.extent[1] - meta.extent[0]); // px per meter
  const half = (meta.rotor_diameter / 2) * scale * 1.6;
  for (let i = 0; i < meta.n_turbines; i++) {
    const [sx, sy] = worldToScreen(meta.layout_x[i], meta.layout_y[i]);
    const bearing = (F.wind_direction[f] + F.yaw[f][i]) * Math.PI / 180;
    // nacelle points upwind: (sin, cos) in world (y up); rotor line is perpendicular
    const nax = Math.sin(bearing), nay = Math.cos(bearing);
    const rx = Math.cos(bearing), ry = -Math.sin(bearing);
    const col = powerColor(F.power[f][i] / pmax);
    // rotor disc (edge-on line)
    ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(sx - rx * half, sy + ry * half);
    ctx.lineTo(sx + rx * half, sy - ry * half);
    ctx.stroke();
    // nacelle tick pointing upwind
    ctx.strokeStyle = "rgba(255,255,255,0.85)"; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx + nax * half * 0.55, sy - nay * half * 0.55);
    ctx.stroke();
    ctx.fillStyle = "rgba(0,0,0,0.65)";
    ctx.beginPath(); ctx.arc(sx, sy, 2.2, 0, 7); ctx.fill();
  }
}

function drawWind(dirDeg, speed) {
  const c = $("windwrap"), ctx = c.getContext("2d");
  ctx.clearRect(0, 0, 92, 92);
  const cx = 46, cy = 40, R = 26;
  ctx.strokeStyle = "#2a323d"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, 7); ctx.stroke();
  // wind blows TOWARD (dir + 180); arrow points that way. compass 0=N (up), cw.
  const toward = (dirDeg + 180) * Math.PI / 180;
  const dx = Math.sin(toward), dy = -Math.cos(toward);
  ctx.strokeStyle = "#58a6ff"; ctx.fillStyle = "#58a6ff"; ctx.lineWidth = 2.5;
  ctx.beginPath();
  ctx.moveTo(cx - dx * R * 0.8, cy - dy * R * 0.8);
  ctx.lineTo(cx + dx * R * 0.8, cy + dy * R * 0.8);
  ctx.stroke();
  const hx = cx + dx * R * 0.8, hy = cy + dy * R * 0.8;
  const px = -dy, py = dx;
  ctx.beginPath();
  ctx.moveTo(hx, hy);
  ctx.lineTo(hx - dx * 8 + px * 5, hy - dy * 8 + py * 5);
  ctx.lineTo(hx - dx * 8 - px * 5, hy - dy * 8 - py * 5);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#8b949e"; ctx.font = "10px system-ui"; ctx.textAlign = "center";
  ctx.fillText("N", cx, cy - R - 3);
  ctx.fillStyle = "#e6edf3"; ctx.font = "11px system-ui";
  ctx.fillText(`${dirDeg.toFixed(0)}° · ${speed.toFixed(1)} m/s`, cx, 84);
}

function updateReadouts(f) {
  const meta = state.meta, F = meta.frames;
  const mw = state.farmPower[f] / 1e6;
  const wind = `${F.wind_direction[f].toFixed(0)}° · ${F.wind_speed[f].toFixed(1)} m/s`;
  const mwh = state.cumEnergy[f] / 3.6e9;
  $("hud-power").textContent = `${mw.toFixed(2)} MW`;
  $("hud-wind").textContent = wind;
  $("hud-reward").textContent = F.reward[f].toFixed(3);
  $("hud-energy").textContent = `${mwh.toFixed(2)} MWh`;
  $("hud-step").textContent = String(F.step_count[f]);
  $("ro-power").textContent = `${mw.toFixed(2)} MW`;
  $("ro-wind").textContent = wind;
  $("ro-reward").textContent = F.reward[f].toFixed(3);
  $("ro-energy").textContent = `${mwh.toFixed(2)} MWh`;
}

function fitCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth || cv.parentElement.clientWidth;
  const h = cv.height;
  if (cv.width !== Math.round(w * dpr) || cv._h !== h) {
    cv.width = Math.round(w * dpr);
    cv.height = Math.round(h * dpr);
    cv._h = h;
  }
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, w: cv.width / dpr, h: cv.height / dpr };
}

function drawBars(f) {
  const cv = $("bars");
  cv.style.height = "150px";
  const { ctx, w, h } = fitCanvas(cv);
  ctx.clearRect(0, 0, w, h);
  const meta = state.meta, F = meta.frames;
  const n = meta.n_turbines, pmax = meta.power_max;
  const pad = 4, bw = (w - pad * 2) / n;
  for (let i = 0; i < n; i++) {
    const t = F.power[f][i] / pmax;
    const bh = t * (h - 16);
    ctx.fillStyle = powerColor(t);
    ctx.fillRect(pad + i * bw + 1, h - 12 - bh, Math.max(1, bw - 2), bh);
  }
  ctx.fillStyle = "#8b949e"; ctx.font = "9px system-ui"; ctx.textAlign = "center";
  if (n <= 16) for (let i = 0; i < n; i++) ctx.fillText(String(i), pad + i * bw + bw / 2, h - 2);
}

function drawTimeline(cv, series, f, unit, color) {
  const { ctx, w, h } = fitCanvas(cv);
  ctx.clearRect(0, 0, w, h);
  const meta = state.meta;
  const n = series.length;
  let lo = Infinity, hi = -Infinity;
  for (const v of series) { if (v < lo) lo = v; if (v > hi) hi = v; }
  if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const pad = 6;
  const X = (i) => (i / (n - 1)) * (w - pad * 2) + pad;
  const Y = (v) => h - pad - ((v - lo) / (hi - lo)) * (h - pad * 2);
  // truncation boundaries
  ctx.strokeStyle = "rgba(240,198,116,0.35)"; ctx.lineWidth = 1;
  meta.frames.truncated.forEach((t, i) => {
    if (!t) return;
    ctx.beginPath(); ctx.moveTo(X(i), 0); ctx.lineTo(X(i), h); ctx.stroke();
  });
  // series
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
  for (let i = 0; i < n; i++) { const x = X(i), y = Y(series[i]); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.stroke();
  // playhead
  ctx.strokeStyle = "#e6edf3"; ctx.lineWidth = 1; ctx.beginPath();
  ctx.moveTo(X(f), 0); ctx.lineTo(X(f), h); ctx.stroke();
  ctx.fillStyle = color; ctx.beginPath(); ctx.arc(X(f), Y(series[f]), 3, 0, 7); ctx.fill();
  ctx.fillStyle = "#8b949e"; ctx.font = "9px system-ui"; ctx.textAlign = "left";
  ctx.fillText(`${hi.toFixed(hi < 10 ? 2 : 0)} ${unit}`, 4, 9);
  ctx.fillText(`${lo.toFixed(lo < 10 ? 2 : 0)} ${unit}`, 4, h - 2);
  cv.onclick = (ev) => {
    const rect = cv.getBoundingClientRect();
    const frac = (ev.clientX - rect.left - pad) / (rect.width - pad * 2);
    seek(Math.round(frac * (n - 1)));
  };
}

async function seek(frame) {
  frame = Math.max(0, Math.min(state.meta.n_frames - 1, frame));
  state.frame = frame;
  await ensureField(frame);
  render();
  prefetchAround(frame);
}

function wireControls() {
  $("play").onclick = togglePlay;
  $("scrub").oninput = (e) => { pause(); seek(Number(e.target.value)); };
  $("speed").onchange = (e) => { state.speed = Number(e.target.value); };
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); togglePlay(); }
    else if (e.code === "ArrowRight") { pause(); seek(state.frame + 1); }
    else if (e.code === "ArrowLeft") { pause(); seek(state.frame - 1); }
    else if (e.code === "ArrowUp") { e.preventDefault(); stepSpeed(1); }
    else if (e.code === "ArrowDown") { e.preventDefault(); stepSpeed(-1); }
    else if (e.code === "Home") { pause(); seek(0); }
    else if (e.code === "End") { pause(); seek(state.meta.n_frames - 1); }
  });
}

function stepSpeed(dir) {
  const sel = $("speed");
  sel.selectedIndex = Math.max(0, Math.min(sel.options.length - 1, sel.selectedIndex + dir));
  state.speed = Number(sel.value);
}

function togglePlay() { state.playing ? pause() : play(); }
function pause() { state.playing = false; $("play").textContent = "Play"; }
function play() {
  if (state.frame >= state.meta.n_frames - 1) state.frame = 0;
  state.playing = true; $("play").textContent = "Pause";
  state._last = performance.now(); state._acc = 0;
  requestAnimationFrame(tick);
}

async function tick(now) {
  if (!state.playing) return;
  const dt = (now - state._last) / 1000; state._last = now;
  state._acc += dt * 10 * state.speed; // base 10 fps
  if (state._acc >= 1) {
    const advance = Math.floor(state._acc); state._acc -= advance;
    let next = state.frame + advance;
    if (next >= state.meta.n_frames) { pause(); next = state.meta.n_frames - 1; }
    state.frame = next;
    await ensureField(next);
    render();
    prefetchAround(next);
  }
  if (state.playing) requestAnimationFrame(tick);
}

boot();
</script>
</body>
</html>
