[project]
name = "windrl-engine"
version = "0.1.0"
description = "JAX wind-farm simulator (WFCRL/FLORIS GCH reimplementation)"
authors = [
    { name = "MarkHaoxiang", email = "mark.haoxiang@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jax>=0.5.3",
    "jaxtyping>=0.3.10",
    "numpy>=2",
    "pydantic>=2",
    "pyyaml>=6",
    "floris==4.6.6",
]

[project.optional-dependencies]
# GPU (NVIDIA CUDA 12) support, opt-in only: `uv sync --extra gpu` layers the
# `jax[cuda12]` plugin wheels on top of the CPU jax above. Left out of a default
# `uv sync` so CI never pulls the multi-GB CUDA wheels.
gpu = ["jax[cuda12]"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
