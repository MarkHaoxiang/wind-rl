[project]
name = "windrl-engine"
version = "0.1.0"
description = "JAX wind-farm simulator (WFCRL/FLORIS GCH reimplementation)"
authors = [
    { name = "MarkHaoxiang", email = "mark.haoxiang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "jax>=0.7",
    "jaxtyping>=0.3.10",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
