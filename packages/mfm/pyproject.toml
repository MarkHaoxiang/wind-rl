[project]
name = "mfm"
version = "0.1.0"
description = "Meta Flow Maps enable scalable reward alignment."
# Vendored copy (wind-rl T7). Upstream pins its full paper stack (lightning
# nightly, diffusers@git, transformers, imscore, wandb/matplotlib/numpy/hydra
# hard-pins) via `dynamic = ["dependencies"]` -> requirements.txt. wind-rl only
# consumes the flow-map core (mfm.SI, mfm.losses, mfm.models.base_model), whose
# transitive import closure is torch + numpy + timm (flash-attn kernels are
# lazy-imported inside functions). Those hard pins otherwise conflict head-on
# with wind-rl (numpy 2.3.5 vs >=2.4.4, wandb 0.23 vs >=0.28, matplotlib/hydra/
# omegaconf) and would force-downgrade the torch/torchrl stack, so this copy
# declares the minimal static closure instead of the dynamic requirements.txt.
# torch is intentionally NOT listed directly: like wind-rl (which gets torch via
# torchrl) it arrives transitively through timm, so the cu130 index source
# override applies to it as a transitive dep rather than an undeclared-index
# first-party entry.
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "timm",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
