experiment_name: 0002_flowmap_prior
seed: 0

scenario:
  name: flowmap3
  n_turbines: 3
  max_steps: 20
  map_x_length: 2000.0
  map_y_length: 2000.0
  min_distance_between_turbines: 400.0

train:
  n_samples: 4096
  n_iters: 3000
  batch_size: 256
  lr: 1.0e-3
  width: 128
  depth: 4

sampling:
  n_eval: 512
  steps: 4

# Verdict gates (asserted in run.py). Post-projection feasibility must clear the
# threshold; raw (pre-projection) feasibility only has to stay above a documented
# floor -- the prior is a starting point for guidance-time projection, not a hard
# constraint model.
verdict:
  projected_feasibility_threshold: 0.95
  raw_feasibility_floor: 0.30
