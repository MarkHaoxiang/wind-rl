# 0005_real_farm -- first MARL training on a REAL wind-farm layout.
#
# `farm` names a wfcrl real-farm case (see wind_rl.scenario.list_real_farms:
# Ablaincourt 7t, Ormonde 30t, HornsRev1 80t, HornsRev2 91t, WMR 35t, ...). The
# layout is fetched from wind_rl.scenario.real_farm_layout, translated so its
# bounding box sits at (margin, margin), and the scenario map bounds are derived
# from the bbox + margin -- so no map size is hardcoded per farm. `training`
# holds the PPO budget shared by every variant; `variants` lists the agent
# architectures. Swap farms with `farm.name=HornsRev1` etc. on the CLI.
#
# Primary run: Ormonde (30t) x set_transformer (0003's benchmark front-runner),
# n_envs auto (null -> resolves to 20 parallel FLORIS collectors). Fixed wind
# (270 deg / 8 m/s): deterministic eval, large wake-steering headroom, matches
# 0001's regime. Varied wind is a follow-up (needs a wind-conditioned protocol).

farm:
  name: Ormonde
  margin: 500.0
  max_steps: 20
  # 300 m sits below every real farm's true min spacing (Ormonde 525 m,
  # HornsRev1 555 m); the fixed-layout path does not gate on it, it only labels
  # the scenario and sizes the (disabled) render exclusion circles.
  min_distance_between_turbines: 300.0
  fixed_wind_direction: 270.0
  fixed_wind_speed: 8.0

training:
  experiment_name: 0005_real_farm
  seed: 0
  device: cpu
  n_iters: 40
  frames_per_batch: 1000
  # null -> auto: largest divisor of frames_per_batch <= min(fpb//max_steps, 20).
  # First production use of the parallel FLORIS collector (commit 8a30157).
  n_envs: null
  eval_interval: 1
  eval_episodes: 1
  checkpoint_interval: 10

  ppo:
    clip_epsilon: 0.2
    gamma: 0.99
    lmbda: 0.95
    entropy_eps: 0.0
    normalize_advantage: true
    lr: 3e-4
    max_grad_norm: 1.0
    n_epochs: 8
    num_minibatches: 4
    lr_scheduler: true
    min_lr: 1e-4

  logging:
    project: wind-rl
    use_wandb: true

variants:
  - name: set_transformer
    model:
      kind: set_transformer
      embed_dim: 64
      num_heads: 4
      num_layers: 2
      canonicalize_wind: true
      initial_std: 0.3
  - name: mlp
    model:
      kind: mlp
      num_cells: 64
      depth: 2
      initial_std: 0.3
