# 0001_fixed_layout_marl -- fixed-layout MARL benchmark.
#
# Trains each agent variant under an IDENTICAL PPO budget on the SAME fixed
# layout(s), then compares learning. `base` holds everything shared (scenario,
# layout, PPO, budget); `variants` lists the agent architectures to benchmark.
# Add a variant by appending an entry with its typed `model` config -- `kind`
# discriminates the model union (mlp / gcn / future kinds), so the list is the
# only thing that grows.

base:
  experiment_name: 0001_fixed_layout_marl
  seed: 0
  n_iters: 40
  frames_per_batch: 1000
  eval_interval: 1
  eval_episodes: 1
  checkpoint_interval: 10

  # 3-turbine row aligned with the fixed 270 deg (westerly) wind: turbines 2 and
  # 3 sit in turbine 1's wake, so wake steering (yaw offsets on the upstream
  # turbines) raises total farm power -- the signal this benchmark asserts each
  # variant learns. To benchmark on a real fixed farm instead, replace `layout`
  # with the coordinates from `wind_rl.scenario.real_farm_layout(<name>)` and set
  # `scenario.n_turbines` to match; the default is the row below.
  layout:
    - [252.0, 1000.0]
    - [756.0, 1000.0]
    - [1260.0, 1000.0]

  scenario:
    name: fixed3
    n_turbines: 3
    max_steps: 20
    map_x_length: 2000.0
    map_y_length: 2000.0
    min_distance_between_turbines: 400.0
    # Fixed wind aligned with the row: deterministic eval, large steering headroom.
    fixed_wind_direction: 270.0
    fixed_wind_speed: 8.0

  ppo:
    clip_epsilon: 0.2
    gamma: 0.99
    lmbda: 0.95
    entropy_eps: 0.0
    normalize_advantage: true
    lr: 3e-4
    max_grad_norm: 1.0
    n_epochs: 8
    num_minibatches: 4
    lr_scheduler: true
    min_lr: 1e-4

  logging:
    project: wind-rl-fixed-layout-marl
    use_wandb: false

variants:
  - name: mlp
    model:
      kind: mlp
      num_cells: 64
      depth: 2
      initial_std: 0.3
  - name: gcn
    model:
      kind: gcn
      hidden_dim: 64
      num_layers: 2
      initial_std: 0.3
