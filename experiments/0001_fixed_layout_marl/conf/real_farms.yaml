# 0001_fixed_layout_marl / real_farms -- benchmark on a REAL wfcrl farm layout.
#
# `farm` names a wfcrl real-farm case (wind_rl.scenario.list_real_farms: Ormonde
# 30t, HornsRev1 80t, HornsRev2 91t, WMR 35t, Ablaincourt 7t, ...). The library
# (`resolve_real_farm`) fetches the layout, translates its native metre-scale
# frame so the bounding box sits at (margin, margin), and derives the map bounds
# from bbox + margin -- so the scenario `name`, `n_turbines`, and map sizes below
# are placeholders overwritten at runtime; the rest of `scenario` (max_steps,
# spacing, fixed wind) is the template kept for the resolved farm. Swap farms with
# `farm.name=HornsRev1` on the CLI. gate=finite: the claim is capability (finite,
# PPO-stable training) at production scale; learning at 30+ fixed-wind turbines is
# read off the table, not gated. (Migrated from 0005_real_farm; see JOURNAL.md.)

gate: finite
seeds: [0]

farm:
  name: Ormonde
  margin: 500.0

base:
  experiment_name: 0001_real_farm
  seed: 0
  device: cpu
  n_iters: 40
  frames_per_batch: 1000
  # null -> auto: largest divisor of frames_per_batch <= min(fpb//max_steps, 20).
  # First production use of the parallel FLORIS collector (commit 8a30157).
  n_envs: null
  eval_interval: 1
  eval_episodes: 1
  checkpoint_interval: 10

  scenario:
    # name / n_turbines / map_*_length are overwritten by resolve_real_farm from
    # the real farm's geometry; the fields below are the template it keeps.
    name: real_placeholder
    n_turbines: 1
    max_steps: 20
    map_x_length: 1.0
    map_y_length: 1.0
    # 300 m sits below every real farm's true min spacing (Ormonde 525 m,
    # HornsRev1 555 m); the fixed-layout path does not gate on it, it only labels
    # the scenario and sizes the (disabled) render exclusion circles.
    min_distance_between_turbines: 300.0
    fixed_wind_direction: 270.0
    fixed_wind_speed: 8.0

  ppo:
    clip_epsilon: 0.2
    gamma: 0.99
    lmbda: 0.95
    entropy_eps: 0.0
    normalize_advantage: true
    lr: 3.0e-4
    max_grad_norm: 1.0
    n_epochs: 8
    num_minibatches: 4
    lr_scheduler: true
    min_lr: 1.0e-4

  logging:
    project: wind-rl
    use_wandb: true

variants:
  - name: set_transformer
    model:
      kind: set_transformer
      embed_dim: 64
      num_heads: 4
      num_layers: 2
      canonicalize_wind: true
      initial_std: 0.3
  - name: mlp
    model:
      kind: mlp
      num_cells: 64
      depth: 2
      initial_std: 0.3
