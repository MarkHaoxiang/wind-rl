# 0004_ppo_tuning -- PPO tuning levers exposed by 0001 rich telemetry.
#
# 0001's rich-telemetry runs showed PPO is stable but conservative on the fixed
# 3-turbine row: pre-clip grad norm ~8x above max_grad_norm=1.0 (clip saturates
# every step, so effective LR is ~8x smaller than nominal), clip fraction <2%,
# approx-KL <0.005 (updates sit far inside the trust region). This sweep tests
# whether loosening the grad clip and/or raising LR speeds convergence without
# instability, plus one entropy-bonus arm.
#
# `base` holds everything shared (scenario, layout, budget, base PPO). `arms`
# is a 2x3 factorial over lr x max_grad_norm plus one entropy arm; each arm
# overrides only the PPO fields it names and inherits the rest. The single best
# arm (by mean eval AUC, gated on stability) is then validated on a 6-turbine
# row to check it generalises past the 3-turbine benchmark.

experiment_name: 0004_ppo_tuning
seeds: [0, 1]
# CPU: FLORIS is CPU-bound, matching 0001/0003.
device: cpu
n_iters: 40
frames_per_batch: 1000
eval_episodes: 1

# 3-turbine westerly row, identical to 0001 (deterministic fixed wind, large
# wake-steering headroom).
scenario:
  name: fixed3
  n_turbines: 3
  max_steps: 20
  map_x_length: 2000.0
  map_y_length: 2000.0
  min_distance_between_turbines: 400.0
  fixed_wind_direction: 270.0
  fixed_wind_speed: 8.0

layout:
  - [252.0, 1000.0]
  - [756.0, 1000.0]
  - [1260.0, 1000.0]

model:
  kind: mlp
  num_cells: 64
  depth: 2
  initial_std: 0.3

# Base PPO == 0001's settings; arms below patch it.
ppo:
  clip_epsilon: 0.2
  gamma: 0.99
  lmbda: 0.95
  entropy_eps: 0.0
  normalize_advantage: true
  lr: 3.0e-4
  max_grad_norm: 1.0
  n_epochs: 8
  num_minibatches: 4
  lr_scheduler: true
  min_lr: 1.0e-4

logging:
  project: wind-rl
  use_wandb: true

# 6-turbine westerly row for the winner-generalisation check (matches 0001's
# scale probe: x = 252..2772 at 504 m spacing, y = 1000, map 3200x2000).
validation:
  n_iters: 20
  seeds: [0, 1]
  scenario:
    name: fixed6
    n_turbines: 6
    max_steps: 20
    map_x_length: 3200.0
    map_y_length: 2000.0
    min_distance_between_turbines: 400.0
    fixed_wind_direction: 270.0
    fixed_wind_speed: 8.0
  layout:
    - [252.0, 1000.0]
    - [756.0, 1000.0]
    - [1260.0, 1000.0]
    - [1764.0, 1000.0]
    - [2268.0, 1000.0]
    - [2772.0, 1000.0]

# 2x3 factorial (lr x max_grad_norm) + one entropy arm. Baseline == 0001.
arms:
  - name: baseline
  - name: gradnorm5
    max_grad_norm: 5.0
  - name: gradnorm10
    max_grad_norm: 10.0
  - name: lr1e-3
    lr: 1.0e-3
  - name: gradnorm5_lr1e-3
    max_grad_norm: 5.0
    lr: 1.0e-3
  - name: gradnorm10_lr1e-3
    max_grad_norm: 10.0
    lr: 1.0e-3
  - name: entropy1e-3
    entropy_eps: 1.0e-3
