# 0003_arch_bench -- architecture benchmark suite (DECISIVE profile).
#
# The upgrade 0003's first-run Decision called for: exercise the geometric bias
# the quick profile under-exercised.
#   - Varied wind: fixed_wind_direction unset (null) => wfcrl samples a random
#     inflow direction every episode, so a wind-conditioned, rotation-aware
#     policy must generalise across directions (and critic-EV is meaningful
#     again: return variance exists). Eval averages over several random-wind
#     episodes per iter.
#   - Scale: an 8-turbine and a 16-turbine tier, both over {mlp, gcn,
#     set_transformer}. 16t is where wake interactions and locality matter most,
#     so gcn is carried there too (it fit the ~2.5h budget: env-dominated
#     ~18 s/iter, measured near-identical across archs).
#   - Budget: 20 PPO iters x 3 seeds per (arch, tier), identical across archs.
# Run: `uv run python experiments/0003_arch_bench/run.py --config-name decisive`.

experiment_name: 0003_arch_bench_decisive
seed: 0
layout_seed: 0
device: cpu

critic:
  n_rollouts: 300
  gamma: 0.99
  val_fraction: 0.2
  n_steps: 2500
  batch_size: 256
  lr: 2.0e-3
  ev_gate: 0.0

policy:
  seeds: [0, 1, 2]
  n_iters: 20
  frames_per_batch: 1000
  # Varied wind => single-episode eval is dominated by the sampled direction;
  # average over several random-wind episodes so the windowed delta tracks
  # learning, not the wind draw.
  eval_episodes: 5
  ppo:
    clip_epsilon: 0.2
    gamma: 0.99
    lmbda: 0.95
    entropy_eps: 0.0
    normalize_advantage: true
    lr: 3.0e-4
    max_grad_norm: 1.0
    n_epochs: 8
    num_minibatches: 4
    lr_scheduler: true
    min_lr: 1.0e-4

logging:
  project: wind-rl
  use_wandb: true

tiers:
  - name: t8_varied
    scenario:
      name: arch8v
      n_turbines: 8
      max_steps: 20
      map_x_length: 2000.0
      map_y_length: 2000.0
      min_distance_between_turbines: 400.0
      fixed_wind_direction: null
      fixed_wind_speed: 8.0
    variants:
      - name: mlp
        model: &mlp
          kind: mlp
          num_cells: 64
          depth: 2
          initial_std: 0.3
      - name: gcn
        model: &gcn
          kind: gcn
          hidden_dim: 64
          num_layers: 2
          initial_std: 0.3
      - name: set_transformer
        model: &set_transformer
          kind: set_transformer
          embed_dim: 64
          num_heads: 4
          num_layers: 2
          initial_std: 0.3
  - name: t16_varied
    scenario:
      name: arch16v
      n_turbines: 16
      max_steps: 20
      map_x_length: 2000.0
      map_y_length: 2000.0
      min_distance_between_turbines: 400.0
      fixed_wind_direction: null
      fixed_wind_speed: 8.0
    variants:
      - name: mlp
        model: *mlp
      - name: gcn
        model: *gcn
      - name: set_transformer
        model: *set_transformer
