# 0003_arch_bench -- TIEBREAK profile (convergence-budget head-to-head).
#
# The decisive profile's open question: the two proxies split -- set_transformer
# decisively wins critic explained-variance (0.785@8t / 0.880@16t, scale-improving)
# but gcn was the only arch with all six seeds positive on the short-budget policy
# delta. That 20-iter probe cannot settle which arch wins ACTUAL training to
# convergence. This profile answers it: gcn vs set_transformer only, full MAPPO to
# a plateau, on the SAME varied-wind distribution and SAME layouts as decisive
# (scenario names arch8v/arch16v + layout_seed 0 => identical sampled layouts).
#
#   - Convergence budget: 100 PPO iters x 3 seeds per (arch, tier). Calibrated
#     s/iter (n_envs=10): 8t ~3.1-3.4s, 16t ~4.6-6.0s => ~90 min total; the last
#     third (iters 67-100) is the plateau window the promotion verdict reads.
#   - Parallel collection capped at n_envs=10 (largest divisor of frames_per_batch
#     <= 12) to share the box with a concurrent training agent; cells run
#     sequentially via the shared sweep loop.
#   - Eval over 5 random-wind episodes/iter so the plateau reward tracks the
#     learned policy, not the sampled inflow direction.
# Run: `uv run python experiments/0003_arch_bench/run.py --config-name tiebreak`.

experiment_name: 0003_arch_bench_tiebreak
seed: 0
layout_seed: 0
device: cpu

critic:
  n_rollouts: 300
  gamma: 0.99
  val_fraction: 0.2
  n_steps: 2500
  batch_size: 256
  lr: 2.0e-3
  ev_gate: 0.0

policy:
  seeds: [0, 1, 2]
  n_iters: 100
  frames_per_batch: 1000
  n_envs: 10
  eval_episodes: 5
  ppo:
    clip_epsilon: 0.2
    gamma: 0.99
    lmbda: 0.95
    entropy_eps: 0.0
    normalize_advantage: true
    lr: 3.0e-4
    max_grad_norm: 1.0
    n_epochs: 8
    num_minibatches: 4
    lr_scheduler: true
    min_lr: 1.0e-4

logging:
  project: wind-rl
  use_wandb: true

tiers:
  - name: t8_varied
    scenario:
      name: arch8v
      n_turbines: 8
      max_steps: 20
      map_x_length: 2000.0
      map_y_length: 2000.0
      min_distance_between_turbines: 400.0
      fixed_wind_direction: null
      fixed_wind_speed: 8.0
    variants:
      - name: gcn
        model: &gcn
          kind: gcn
          hidden_dim: 64
          num_layers: 2
          initial_std: 0.3
      - name: set_transformer
        model: &set_transformer
          kind: set_transformer
          embed_dim: 64
          num_heads: 4
          num_layers: 2
          canonicalize_wind: true
          initial_std: 0.3
  - name: t16_varied
    scenario:
      name: arch16v
      n_turbines: 16
      max_steps: 20
      map_x_length: 2000.0
      map_y_length: 2000.0
      min_distance_between_turbines: 400.0
      fixed_wind_direction: null
      fixed_wind_speed: 8.0
    variants:
      - name: gcn
        model: *gcn
      - name: set_transformer
        model: *set_transformer
