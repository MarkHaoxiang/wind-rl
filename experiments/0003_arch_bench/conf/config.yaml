# 0003_arch_bench -- architecture benchmark suite.
#
# Ranks the ModelConfig union architectures (mlp / gcn / set_transformer) with
# two fast proxies on ONE fixed 8-turbine FLORIS layout, under identical budgets:
#   - critic:  supervised value regression (EV vs predict-the-mean baseline)
#   - policy:  short fixed-budget MAPPO (windowed eval-reward delta + s/iter)
# Add an architecture by appending to `variants` with its typed `model` config;
# `kind` discriminates the union, so the list is the only thing that grows.
# Default config targets <= ~40 min wall-clock on CPU.

experiment_name: 0003_arch_bench
seed: 0
# Fixes the single 8-turbine layout (sample_feasible_layout). Wind is fixed too
# (scenario below), so the critic proxy's only signal is the yaw trajectory.
layout_seed: 0
# Pinned to CPU: FLORIS is CPU-bound so GPU does not help, and this surfaces the
# set_transformer attention vmap-fallback cost honestly (research doc note).
device: cpu

scenario:
  name: arch8
  n_turbines: 8
  max_steps: 20
  map_x_length: 2000.0
  map_y_length: 2000.0
  min_distance_between_turbines: 400.0
  fixed_wind_direction: 270.0
  fixed_wind_speed: 8.0

critic:
  n_rollouts: 300
  gamma: 0.99
  val_fraction: 0.2
  # Identical budget across archs; sized so the slowest-converging critic (mlp)
  # clears the EV gate with margin, not tuned to crown a winner.
  n_steps: 2500
  batch_size: 256
  lr: 2.0e-3
  # Functional gate: an architecture's critic must beat the predict-the-mean
  # baseline (EV = 0) on held-out returns.
  ev_gate: 0.0

policy:
  seeds: [0, 1, 2]
  n_iters: 8
  frames_per_batch: 1000
  eval_episodes: 1
  ppo:
    clip_epsilon: 0.2
    gamma: 0.99
    lmbda: 0.95
    entropy_eps: 0.0
    normalize_advantage: true
    lr: 3.0e-4
    max_grad_norm: 1.0
    n_epochs: 8
    num_minibatches: 4
    lr_scheduler: true
    min_lr: 1.0e-4

logging:
  project: wind-rl-arch-bench
  use_wandb: false

variants:
  - name: mlp
    model:
      kind: mlp
      num_cells: 64
      depth: 2
      initial_std: 0.3
  - name: gcn
    model:
      kind: gcn
      hidden_dim: 64
      num_layers: 2
      initial_std: 0.3
  - name: set_transformer
    model:
      kind: set_transformer
      embed_dim: 64
      num_heads: 4
      num_layers: 2
      initial_std: 0.3
