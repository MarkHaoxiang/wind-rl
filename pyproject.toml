[tool.uv.workspace]
members = ["packages/*"]
# windrl-train is version-isolated (Mava pins jax==0.5.3 / py>=3.10,<3.13), which
# cannot co-resolve with the root py3.13 / jax 0.11 stack. It has its own venv;
# keep it out of the root workspace resolution entirely.
exclude = ["packages/windrl-train"]

[tool.uv.sources]
wind-rl = { workspace = true }

[dependency-groups]
# Deliberately does *not* list "wind-rl" here (unlike catan-engine's pattern
# of listing every workspace member in dev): a virtual workspace's plain
# `uv sync` already installs every `[tool.uv.workspace]` member regardless of
# dev-group membership, so `uv run python -c "import wind_rl"` works at root
# without it.
dev = [
    "beartype>=0.19",
    # Backs windrl-engine's optional [viz] extra so strict mypy sees real
    # matplotlib types for analysis/plots.py; runtime consumers opt in via the
    # extra instead.
    "matplotlib>=3.9",
    "mypy>=1.11",
    "pre-commit>=4",
    "pydantic>=2",
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.15",
]

[tool.ruff]
# wind_rl now lives under packages/wind-rl/src, not the repo-root `src/` ruff
# auto-detects by default; without this, isort no longer recognizes `wind_rl`
# as first-party and re-groups import blocks (moved files must stay
# byte-identical).
src = ["packages/wind-rl/src", "packages/windrl-engine/src"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# jaxtyping shape strings in annotations ("turbines grid grid", "*shape") trip
# ruff's forward-ref parser: F821 (undefined name) and F722 (syntax in forward
# annotation). They are not real errors.
"packages/windrl-engine/src/**" = ["F722", "F821"]

[tool.mypy]
mypy_path = ["packages/wind-rl/src", "packages/windrl-engine/src"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_generics = true
disallow_any_explicit = true
warn_unreachable = true
local_partial_types = true
explicit_package_bases = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "redundant-self",
    "possibly-undefined",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["wandb.*", "hydra.*", "floris.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/wind-rl/tests", "packages/windrl-engine/tests"]
addopts = "-q"
markers = [
    "slow: long-running (large sample counts, many env steps); excluded from quick local runs on request only, not from CI by default",
]
