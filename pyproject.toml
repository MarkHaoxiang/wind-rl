[project]
name = "wind-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MarkHaoxiang", email = "mark.haoxiang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "omegaconf>=2.3.1",
    "pettingzoo>=1.25.0",
    "pydantic>=2",
    "pydantic-settings>=2.14.2",
    "torchrl==0.11.1",
    "wfcrl",
]

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
wfcrl = { workspace = true }

[tool.uv.workspace]
members = [
".",
"packages/*"
]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=4",
    "pydantic>=2",
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.15",
]

[tool.ruff]
extend-exclude = ["packages/wfcrl-env"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "C4", "SIM", "RUF"]

[tool.mypy]
mypy_path = ["src"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_generics = false
disallow_any_explicit = false
warn_unreachable = true
explicit_package_bases = true
exclude = ["packages/wfcrl-env"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["wfcrl.*", "torchrl.*", "tensordict.*", "pettingzoo.*", "wandb.*", "hydra.*", "matplotlib.*", "scipy.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
