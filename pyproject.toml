[project]
name = "wind-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MarkHaoxiang", email = "mark.haoxiang@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "torchrl==0.11.1",
    "wfcrl",
]

[project.scripts]
wind-rl = "wind_rl:main"

[build-system]
requires = ["uv_build>=0.11.5,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
wfcrl = { workspace = true }

[tool.uv.workspace]
members = [
".",
"packages/*"
]
