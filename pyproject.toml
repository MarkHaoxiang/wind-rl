[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
mfm = { workspace = true }
wfcrl = { workspace = true }
wind-rl = { workspace = true }

[dependency-groups]
# Deliberately does *not* list "wind-rl" here (unlike catan-engine's pattern
# of listing every workspace member in dev): a virtual workspace's plain
# `uv sync` already installs every `[tool.uv.workspace]` member (wind-rl,
# wfcrl) regardless of dev-group membership, so `uv run python -c "import
# wind_rl"` works at root without it. Listing it would instead make CI's
# `uv sync --only-dev` step (see ci.yml) pull wind-rl's full dependency
# closure -- including cu130 torch -- defeating the staged CPU-torch install
# CI relies on. Verified empirically: `--only-dev` with wind-rl omitted here
# installs tooling only; with it added, torch+CUDA wheels come along.
dev = [
    "mypy>=1.11",
    "pre-commit>=4",
    "pydantic>=2",
    "pytest>=8",
    "pytest-xdist>=3",
    "ruff>=0.15",
]

[tool.ruff]
extend-exclude = ["packages/wfcrl-env", "packages/mfm"]
# wind_rl now lives under packages/wind-rl/src, not the repo-root `src/` ruff
# auto-detects by default; without this, isort no longer recognizes `wind_rl`
# as first-party and re-groups import blocks (moved files must stay
# byte-identical).
src = ["packages/wind-rl/src"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "C4", "SIM", "RUF"]

[tool.mypy]
mypy_path = ["packages/wind-rl/src"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_generics = true
disallow_any_explicit = true
warn_unreachable = true
local_partial_types = true
explicit_package_bases = true
exclude = ["packages/wfcrl-env", "packages/mfm"]
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "redundant-self",
    "possibly-undefined",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[[tool.mypy.overrides]]
module = ["wfcrl.*", "mfm.*", "torchrl.*", "tensordict.*", "pettingzoo.*", "wandb.*", "hydra.*", "matplotlib.*", "scipy.*", "tqdm.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/wind-rl/tests"]
addopts = "-q"
markers = [
    "sim: touches wfcrl/FLORIS (needs system MPI + FLORIS at import); run locally, excluded from CI via `-m 'not sim'`",
]
