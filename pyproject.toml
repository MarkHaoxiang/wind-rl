[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
windrl-engine = { workspace = true }
windrl-train = { workspace = true }

[dependency-groups]
dev = [
    "beartype>=0.19",
    # Backs windrl-engine's optional [viz] extra so strict mypy sees real
    # matplotlib types for analysis/plots.py; runtime consumers opt in via the
    # extra instead.
    "matplotlib>=3.9",
    "mypy>=1.11",
    "pre-commit>=4",
    "pytest>=8",
    "pytest-cov>=6",
    "pytest-xdist>=3",
    "ruff>=0.15",
]

[tool.ruff]
src = ["packages/windrl-engine/src", "packages/windrl-train/src"]

[tool.ruff.lint]
extend-select = ["I", "B", "UP", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# jaxtyping shape strings in annotations ("turbines grid grid", "*shape") trip
# ruff's forward-ref parser: F821 (undefined name) and F722 (syntax in forward
# annotation). They are not real errors.
"packages/windrl-engine/src/**" = ["F722", "F821"]
"packages/windrl-train/src/**" = ["F722", "F821"]

[tool.mypy]
mypy_path = ["packages/windrl-engine/src", "packages/windrl-train/src"]
plugins = ["pydantic.mypy"]
strict = true
disallow_any_generics = true
disallow_any_explicit = true
warn_unreachable = true
local_partial_types = true
explicit_package_bases = true
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "redundant-self",
    "possibly-undefined",
    "unused-awaitable",
    "explicit-override",
    "mutable-override",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# Third-party packages that ship no py.typed, so imports from them are untyped.
# floris is a real runtime dependency of windrl-engine; wandb still ships no
# typing.
[[tool.mypy.overrides]]
module = ["wandb.*", "floris.*"]
ignore_missing_imports = true

# The wandb logger wraps an untyped client: strict `disallow_any`/untyped-call
# checks there flag wandb's own type gaps, not our bugs.
[[tool.mypy.overrides]]
module = ["windrl_train.logging"]
disallow_any_explicit = false
disallow_untyped_calls = false
warn_unreachable = false

[tool.pytest.ini_options]
testpaths = ["packages/windrl-engine/tests", "packages/windrl-train/tests"]
addopts = "-q"
markers = [
    "slow: long-running (large sample counts, many env steps); excluded from quick local runs on request only, not from CI by default",
]
