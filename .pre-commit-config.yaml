repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(packages/windrl-engine/(src|tests)|packages/windrl-train/src|experiments)/
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(packages/windrl-engine/(src|tests)|packages/windrl-train/src|experiments)/
      - id: mypy
        name: mypy
        # Experiments are standalone scripts in digit-prefixed dirs (run.py
        # collides as a duplicate module across dirs), so each dir is checked on
        # its own.
        entry: bash -c 'shopt -s nullglob; uv run mypy packages/windrl-engine/src packages/windrl-train/src && for d in experiments/*/; do if find "$d" -name "*.py" -print -quit | grep -q .; then uv run mypy "$d" || exit 1; fi; done'
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
