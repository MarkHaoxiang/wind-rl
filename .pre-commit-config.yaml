repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff-check
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(packages/wind-rl/(src|tests)|experiments)/
      - id: ruff-format
        name: ruff-format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(packages/wind-rl/(src|tests)|experiments)/
      - id: mypy
        name: mypy
        # Experiments are standalone Hydra scripts in digit-prefixed dirs (run.py
        # collides as a duplicate module across dirs), so each dir is checked on
        # its own.
        entry: bash -c 'uv run mypy packages/wind-rl/src packages/wind-rl/tests && for d in experiments/*/; do uv run mypy "$d" || exit 1; done'
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest
        entry: uv run pytest -q
        language: system
        types: [python]
        pass_filenames: false
