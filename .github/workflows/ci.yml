name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      # One venv for the whole repo: installs both workspace members
      # (windrl-engine + windrl-train) and their declared closures. The `gpu`
      # extra is opt-in and left out here so CI never pulls the CUDA wheels.
      - name: Sync workspace
        run: uv sync

      - name: Ruff check
        run: uv run ruff check packages/windrl-engine/src packages/windrl-engine/tests packages/windrl-train/src experiments

      - name: Ruff format check
        run: uv run ruff format --check packages/windrl-engine/src packages/windrl-engine/tests packages/windrl-train/src experiments

      - name: Mypy (engine + train src)
        run: uv run mypy packages/windrl-engine/src packages/windrl-train/src

      # Experiments are standalone scripts in digit-prefixed dirs (run.py
      # collides as a duplicate module across dirs), so each dir is checked on
      # its own. Dirs with no .py files (a framework kept only for its
      # report.md) are skipped -- mypy errors on an empty target.
      - name: Mypy (experiments, per directory)
        run: >-
          for d in experiments/*/; do
            if find "$d" -name '*.py' -print -quit | grep -q .; then
              uv run mypy "$d" || exit 1;
            fi;
          done

      # The FLORIS reference tests assert against committed goldens, so nothing
      # imports floris at test time and the whole suite runs unfiltered.
      - name: Pytest
        run: JAX_PLATFORMS=cpu uv run pytest -q
