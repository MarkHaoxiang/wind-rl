name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A full `uv sync` would pull torch from the CUDA index (multi-GB wheels),
      # so CI installs sequentially instead: dev tooling, then a CPU torch, then
      # the pure-Python runtime deps mypy/pytest actually import. This keeps
      # local resolution untouched (no pyproject/uv.lock change).
      #
      # Version-skew note: the CPU index may serve a torch/tensordict slightly
      # newer than uv.lock's CUDA pin (torchrl's range still resolves a
      # satisfying build). CI therefore validates against a near-but-not-lock
      # CPU stack; the locked CUDA stack is exercised locally / in pre-commit.
      - name: Install dev tooling (ruff, mypy, pytest)
        run: uv sync --only-dev

      # torchvision comes from the same CPU index so its compiled ops match this
      # torch: timm (pulled below for the vendored mfm import) needs torchvision,
      # and a PyPI torchvision would mismatch the pytorch-index torch build
      # (`operator torchvision::nms does not exist` at import).
      - name: Install CPU torch + torchvision
        run: uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      # torch stays: wind_rl.generative (SLSQP feasibility projection) and
      # wind_rl.utils import it directly now that the torchrl RL stack is gone.
      # timm brings a CPU torchvision (resolved against the CPU torch above) for
      # the vendored `mfm` flow-map core imported by the generative closure.
      - name: Install pure-Python runtime deps
        run: >-
          uv pip install
          "hydra-core>=1.3.4" "matplotlib>=3.10.8" "numpy>=2.4.4"
          "omegaconf>=2.3.1" "pydantic>=2"
          "pydantic-settings>=2.14.2" "scipy>=1.14" "timm"
          "tqdm>=4.69.0" "wandb[media]>=0.28.1"

      - name: Install vendored mfm (editable, no deps)
        run: uv pip install --no-deps -e packages/mfm

      - name: Install wind-rl (editable, no deps)
        run: uv pip install --no-deps -e packages/wind-rl

      # windrl-engine is pure-Python + jax; the default jax wheel is the CPU
      # build, so unlike torch no index redirection is needed. beartype backs
      # the jaxtyping runtime shape checks in its test conftest.
      - name: Install windrl-engine deps (CPU jax) and package
        run: >-
          uv pip install "jax>=0.7" "jaxtyping>=0.3.10" "beartype>=0.19"
          && uv pip install --no-deps -e packages/windrl-engine

      - name: Ruff check
        run: uv run --no-sync ruff check packages/wind-rl/src packages/wind-rl/tests packages/windrl-engine/src packages/windrl-engine/tests experiments

      - name: Ruff format check
        run: uv run --no-sync ruff format --check packages/wind-rl/src packages/wind-rl/tests packages/windrl-engine/src packages/windrl-engine/tests

      - name: Mypy
        run: uv run --no-sync mypy packages/wind-rl/src packages/wind-rl/tests

      - name: Mypy (windrl-engine)
        run: uv run --no-sync mypy packages/windrl-engine/src

      # Experiments are standalone Hydra scripts in digit-prefixed dirs (run.py
      # collides as a duplicate module across dirs), so each dir is checked on
      # its own, mirroring the pre-commit hook. Dirs with no .py files (e.g. a
      # retired framework kept only for its report.md) are skipped -- mypy errors
      # on an empty target rather than passing trivially.
      - name: Mypy (experiments, per directory)
        run: >-
          for d in experiments/*/; do
            if find "$d" -name '*.py' -print -quit | grep -q .; then
              uv run --no-sync mypy "$d" || exit 1;
            fi;
          done

      # The FLORIS reference tests (packages/windrl-engine/tests) now assert
      # against committed goldens (goldens/floris_v3.5.npz + the frozen WFCRL
      # env trajectories), so nothing imports wfcrl/FLORIS at test time and the
      # whole suite runs on CI unfiltered.
      - name: Pytest
        run: uv run --no-sync pytest -q
